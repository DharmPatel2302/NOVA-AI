# ============================================================
#  NOVA AI — CI/CD Pipeline
#  Triggered: every push to main branch
#
#  4 Stages:
#  1. Code Quality  → ESLint on frontend
#  2. Build         → Build all 5 Docker images
#  3. Security      → Trivy scan + GitLeaks + npm audit
#  4. Deploy        → SSH into EC2, git pull, docker compose up
#
#  Required GitHub Secrets:
#  EC2_HOST     → 65.2.232.188
#  EC2_USER     → ubuntu
#  EC2_SSH_KEY  → contents of nova-ai-key.pem
# ============================================================

name: NOVA AI — CI/CD Pipeline

on:
  push:
    branches:
      - main
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:

  # ════════════════════════════════════════════════════════════
  #  STAGE 1 — CODE QUALITY
  #  Run ESLint on frontend. Bad code fails here — never reaches deploy.
  # ════════════════════════════════════════════════════════════
  code-quality:
    name: "Stage 1 — Code Quality"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: Check for .env files accidentally committed
        run: |
          # Fail if any .env file (not .env.example) is found in the commit
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E "^\.env$|/\.env$" | grep -v "\.example"; then
            echo "ERROR: .env file detected in commit — secrets must not be committed"
            exit 1
          fi
          echo "No .env files in commit"

  # ════════════════════════════════════════════════════════════
  #  STAGE 2 — BUILD
  #  Build all 5 Docker images from the backend/ context.
  #  Uses GitHub Actions cache to speed up repeated builds.
  # ════════════════════════════════════════════════════════════
  build:
    name: "Stage 2 — Build Docker Images"
    runs-on: ubuntu-latest
    needs: code-quality        # Only runs if Stage 1 passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/gateway/Dockerfile
          push: false
          tags: nova-gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Build auth-service image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/auth/Dockerfile
          push: false
          tags: nova-auth-service:latest
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth

      - name: Build chat-service image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/chat/Dockerfile
          push: false
          tags: nova-chat-service:latest
          cache-from: type=gha,scope=chat
          cache-to: type=gha,mode=max,scope=chat

      - name: Build billing-service image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/billing/Dockerfile
          push: false
          tags: nova-billing-service:latest
          cache-from: type=gha,scope=billing
          cache-to: type=gha,mode=max,scope=billing

      - name: Build agent-service image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/services/agent/Dockerfile
          push: false
          tags: nova-agent-service:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  # ════════════════════════════════════════════════════════════
  #  STAGE 3 — SECURITY (DevSecOps)
  #  Three security checks:
  #  a) Trivy — scans Docker images for known CVEs
  #  b) GitLeaks — scans commits for accidentally added secrets
  #  c) npm audit — checks frontend deps for vulnerabilities
  # ════════════════════════════════════════════════════════════
  security:
    name: "Stage 3 — Security Scan"
    runs-on: ubuntu-latest
    needs: build               # Only runs if Stage 2 passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # Full history needed for GitLeaks

      # ── a) GitLeaks — secret leak detection ──────────────────
      - name: Scan for secrets in code (GitLeaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── b) npm audit — dependency vulnerability scan ─────────
      - name: Setup Node.js for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit — frontend dependencies
        run: npm audit --audit-level=high || true
        # || true means: show vulnerabilities but don't fail the pipeline
        # Remove "|| true" to make high/critical CVEs block the deploy
        working-directory: frontend

      - name: npm audit — auth service
        run: npm audit --audit-level=high || true
        working-directory: backend/services/auth

      - name: npm audit — agent service
        run: npm audit --audit-level=high || true
        working-directory: backend/services/agent

      # ── c) Trivy — Docker image vulnerability scan ───────────
      - name: Set up Docker Buildx for Trivy
        uses: docker/setup-buildx-action@v3

      - name: Build auth image for Trivy scan
        run: docker build -f backend/services/auth/Dockerfile -t nova-auth-service:latest ./backend

      - name: Trivy scan — auth-service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nova-auth-service:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0          # Report but don't fail (set to 1 to block on CVEs)

      - name: Build agent image for Trivy scan
        run: docker build -f backend/services/agent/Dockerfile -t nova-agent-service:latest ./backend

      - name: Trivy scan — agent-service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nova-agent-service:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  # ════════════════════════════════════════════════════════════
  #  STAGE 4 — DEPLOY
  #  4a) Build React frontend with production env vars
  #  4b) SSH into EC2 → upload new frontend build → restart backend
  #  Only runs on main branch pushes after all 3 stages pass.
  # ════════════════════════════════════════════════════════════
  deploy:
    name: "Stage 4 — Deploy to AWS EC2"
    runs-on: ubuntu-latest
    needs: security            # Only runs if Stage 3 passes
    if: github.ref == 'refs/heads/main'   # Only deploy from main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 4a) Build React frontend using .env.production ────────
      # VITE bakes env vars at build time — the built JS must have the
      # correct VITE_SERVER_URL or every API call goes to localhost:8000.
      # .env.production is committed (no secrets in it) so no GitHub
      # Secrets are needed here.
      - name: Setup Node.js for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (uses .env.production automatically)
        run: npm run build
        working-directory: frontend
        env:
          # Firebase API key is a client-side public key but GitLeaks flags
          # the AIzaSy prefix as GCP key — inject from secret to keep repo clean
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        # Vite merges process.env overrides on top of .env.production at build time

      # ── 4b) SSH and deploy ────────────────────────────────────
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Decode base64-encoded key to file
          echo "$SSH_KEY" | base64 -d > ~/.ssh/nova-ai-key.pem
          chmod 600 ~/.ssh/nova-ai-key.pem
          head -1 ~/.ssh/nova-ai-key.pem
          wc -l ~/.ssh/nova-ai-key.pem
          ssh-keygen -y -f ~/.ssh/nova-ai-key.pem > /dev/null && echo "Key OK" || echo "Key FAILED"
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload frontend dist to EC2
        run: |
          # Copy the built React app to EC2 — this is what Nginx serves
          scp -i ~/.ssh/nova-ai-key.pem \
            -o StrictHostKeyChecking=no \
            -r frontend/dist/* \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/nova-ai/

      - name: Upload Nginx config to EC2
        run: |
          # Copy nginx config from repo to EC2 sites-available
          scp -i ~/.ssh/nova-ai-key.pem \
            -o StrictHostKeyChecking=no \
            nginx/nova-ai.conf \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/nova-ai.conf

      - name: Install and reload Nginx config on EC2
        run: |
          ssh -i ~/.ssh/nova-ai-key.pem \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'NGINX'
          set -e
          echo "--- Installing Nginx config..."

          # Ensure Nginx is installed
          if ! command -v nginx &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y nginx
          fi

          # Ensure web root exists
          sudo mkdir -p /var/www/nova-ai

          # Install the config from /tmp (where scp dropped it)
          sudo cp /tmp/nova-ai.conf /etc/nginx/sites-available/nova-ai.conf

          # Enable site (symlink) — remove default if present
          sudo ln -sf /etc/nginx/sites-available/nova-ai.conf /etc/nginx/sites-enabled/nova-ai.conf
          sudo rm -f /etc/nginx/sites-enabled/default

          # Test config then reload — zero downtime
          sudo nginx -t
          sudo systemctl reload nginx || sudo systemctl restart nginx

          echo "--- Nginx reloaded OK"
          NGINX

      - name: Deploy to EC2 via SSH
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ssh -i ~/.ssh/nova-ai-key.pem \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "GH_PAT='$GH_PAT' bash -s" << 'DEPLOY'
          set -e
          echo "=== NOVA AI Deployment Started: $(date) ==="

          # Clone repo if it doesn't exist, otherwise pull latest
          if [ ! -d "/home/ubuntu/nova-ai" ]; then
            echo "--- Cloning repository for the first time..."
            git clone https://x-access-token:${GH_PAT}@github.com/DharmPatel2302/NOVA-AI.git /home/ubuntu/nova-ai
          else
            echo "--- Pulling latest code..."
            cd /home/ubuntu/nova-ai
            # Update remote URL to use PAT for authentication
            git remote set-url origin https://x-access-token:${GH_PAT}@github.com/DharmPatel2302/NOVA-AI.git
            git pull origin main
          fi

          # Create stub .env files if they don't exist (fresh server)
          # Real values must be filled in manually after first deploy
          cd /home/ubuntu/nova-ai/backend

          [ ! -f gateway/.env ] && {
            echo "PORT=8000"
            echo "FRONTEND_URL=http://65.2.232.188,http://nova-ai-frontend-19d45e08.s3-website.ap-south-1.amazonaws.com,http://localhost:5173"
            echo "SESSION_SECRET=nova-ai-super-secret-session-key-2024"
            echo "REDIS_URL=redis://redis:6379"
            echo "AUTH_SERVICE=http://auth-service:8001"
            echo "CHAT_SERVICE=http://chat-service:8002"
            echo "AGENT_SERVICE=http://agent-service:8003"
            echo "BILLING_SERVICE=http://billing-service:8004"
            echo "INTERNAL_SERVICE_SECRET=nova-internal-service-secret-2024"
          } > gateway/.env

          # Always update FRONTEND_URL in gateway .env (safe — no secrets)
          sed -i "s|^FRONTEND_URL=.*|FRONTEND_URL=http://65.2.232.188,http://nova-ai-frontend-19d45e08.s3-website.ap-south-1.amazonaws.com,http://localhost:5173|" gateway/.env

          [ ! -f services/auth/.env ] && {
            echo "PORT=8001"
            echo "FRONTEND_URL=http://65.2.232.188,http://nova-ai-frontend-19d45e08.s3-website.ap-south-1.amazonaws.com,http://localhost:5173"
            echo "MONGODB_URI=REPLACE_WITH_MONGODB_URI"
            echo "SESSION_SECRET=nova-ai-super-secret-session-key-2024"
            echo "INTERNAL_SERVICE_SECRET=nova-internal-service-secret-2024"
            echo "REDIS_URL=redis://redis:6379"
            echo "FIREBASE_PROJECT_ID=REPLACE"
            echo "FIREBASE_CLIENT_EMAIL=REPLACE"
            echo "FIREBASE_PRIVATE_KEY=REPLACE"
          } > services/auth/.env

          # Always update FRONTEND_URL in auth .env (safe — no secrets)
          sed -i "s|^FRONTEND_URL=.*|FRONTEND_URL=http://65.2.232.188,http://nova-ai-frontend-19d45e08.s3-website.ap-south-1.amazonaws.com,http://localhost:5173|" services/auth/.env

          [ ! -f services/chat/.env ] && {
            echo "PORT=8002"
            echo "MONGODB_URI=REPLACE_WITH_MONGODB_URI"
            echo "INTERNAL_SERVICE_SECRET=nova-internal-service-secret-2024"
            echo "REDIS_URL=redis://redis:6379"
          } > services/chat/.env

          [ ! -f services/agent/.env ] && {
            echo "PORT=8003"
            echo "MONGODB_URI=REPLACE_WITH_MONGODB_URI"
            echo "INTERNAL_SERVICE_SECRET=nova-internal-service-secret-2024"
            echo "REDIS_URL=redis://redis:6379"
            echo "GROQ_API_KEY=REPLACE"
            echo "GOOGLE_API_KEY=REPLACE"
            echo "TAVILY_API_KEY=REPLACE"
            echo "QDRANT_API_KEY=REPLACE"
            echo "QDRANT_ENDPOINT=REPLACE"
            echo "CHAT_SERVICE_URL=http://chat-service:8002"
            echo "AUTH_SERVICE_URL=http://auth-service:8001"
            echo "BILLING_SERVICE_URL=http://billing-service:8004"
          } > services/agent/.env

          [ ! -f services/billing/.env ] && {
            echo "PORT=8004"
            echo "MONGODB_URI=REPLACE_WITH_MONGODB_URI"
            echo "INTERNAL_SERVICE_SECRET=nova-internal-service-secret-2024"
            echo "RAZORPAY_KEY_ID=REPLACE"
            echo "RAZORPAY_KEY_SECRET=REPLACE"
            echo "AUTH_SERVICE_URL=http://auth-service:8001"
          } > services/billing/.env

          # Check if docker is available
          if ! command -v docker &> /dev/null; then
            echo "--- Docker not ready yet, waiting 30s..."
            sleep 30
          fi

          echo "--- Rebuilding Docker containers..."
          docker compose down || true
          docker compose up -d --build

          echo "--- Waiting for services..."
          sleep 15

          echo "--- Container status:"
          docker compose ps

          echo "=== Deployment Complete: $(date) ==="
          DEPLOY
