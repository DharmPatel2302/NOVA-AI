# ============================================================
#  NOVA AI — Docker Compose
#  Local development & containerized deployment
#  All 6 services: redis, gateway, auth, chat, agent, billing
# ============================================================

services:

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: multiagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Auth Service ─────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: nova-auth-service
    ports:
      - "8001:8001"
    env_file:
      - services/auth/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Chat Service ─────────────────────────────────────────────
  chat-service:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    container_name: nova-chat-service
    ports:
      - "8002:8002"
    env_file:
      - services/chat/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Agent Service ─────────────────────────────────────────────
  agent-service:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    container_name: nova-agent-service
    ports:
      - "8003:8003"
    env_file:
      - services/agent/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - CHAT_SERVICE_URL=http://chat-service:8002
      - AUTH_SERVICE_URL=http://auth-service:8001
      - BILLING_SERVICE_URL=http://billing-service:8004
    depends_on:
      redis:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Billing Service ───────────────────────────────────────────
  billing-service:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    container_name: nova-billing-service
    ports:
      - "8004:8004"
    env_file:
      - services/billing/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── API Gateway ───────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: nova-gateway
    ports:
      - "8000:8000"
    env_file:
      - gateway/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE=http://auth-service:8001
      - CHAT_SERVICE=http://chat-service:8002
      - AGENT_SERVICE=http://agent-service:8003
      - BILLING_SERVICE=http://billing-service:8004
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      agent-service:
        condition: service_started
      billing-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  redis-data:
