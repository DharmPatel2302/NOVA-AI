server {
    listen 80;
    server_name 65.2.232.188 65.2.232.188.nip.io _;

    root /var/www/nova-ai;
    index index.html;

    # ── API proxy — forward all /api/* to the Gateway on port 8000 ──
    # This is the key fix: browser sends requests to port 80 (same origin
    # as the frontend), Nginx forwards them internally to port 8000.
    # Session cookies are sent because origin matches (no cross-origin).
    location /api/ {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;

        # Forward real client IP and host to gateway
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward cookies — required for session authentication
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;

        # Support long-running AI requests (up to 5 minutes)
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # ── React SPA — serve index.html for all non-API routes ─────────
    # Required for React Router — deep links like /chat/abc must serve
    # index.html, not a 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static assets — aggressive caching for JS/CSS/images ────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
